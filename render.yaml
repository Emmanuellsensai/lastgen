services:
  - type: web
    name: lastgen-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PORT
        value: '8080'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYMENT_ADAPTER
        value: simulated
      - key: ALAT_BASE_URL
        sync: false
      - key: ALAT_CHANNEL_ID
        sync: false
      - key: ALAT_API_KEY
        sync: false
      - key: DEMO_MODE
        value: 'true'
      # Browser origins allowed to call this API. It is not a secret, so it
      # lives here rather than as a dashboard-only value: an unset CORS_ORIGIN
      # silently falls back to localhost and every request from the deployed
      # frontend fails preflight. The wildcard covers Vercel preview URLs,
      # which get a fresh subdomain per deployment.
      - key: CORS_ORIGIN
        value: https://lastgen-frontend.vercel.app,https://*.vercel.app,http://localhost:5173
