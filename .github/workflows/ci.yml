name: CI

on:
  push:
    branches: [main, feat/backend]
  pull_request:

jobs:
  gate:
    name: typecheck · lint · test · format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend typecheck (src)
        run: pnpm --filter @lastgen/backend typecheck

      - name: Backend typecheck (tests)
        run: pnpm --filter @lastgen/backend typecheck:test

      - name: Lint
        run: pnpm lint

      - name: Shared correctness suites
        run: pnpm exec vitest run tests/correctness

      - name: Backend suites
        run: pnpm --filter @lastgen/backend test

      - name: Backend format check
        run: pnpm format:check:backend